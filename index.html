<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 引擎中文文档</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>

  <script>
    // ========== 自动修复所有 HTML <a> 链接 ==========
    function fixAllLinks() {
      document.querySelectorAll('#app a[href$=".md"]').forEach(function(el) {
        var href = el.getAttribute('href');
        if (!href || href.match(/^(https?|mailto|javascript|#)/i)) return;

        // 1. 去掉 .md
        var newHref = href.replace(/\.md$/, '');
        // 2. 映射 /manual/ → /manual-zh/
        newHref = newHref.replace('/manual/', '/manual-zh/');
        // 3. 确保以 / 结尾
        if (!newHref.endsWith('/')) newHref += '/';

        el.setAttribute('href', newHref);
      });
    }

    // ========== Docsify 配置 ==========
    window.$docsify = {
      name: 'Flax 中文文档',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      basePath: '/FlaxDocs-zh/',
      homepage: 'index.md',
      plugins: [
        function(hook) {
          // 每次页面切换后重新修复链接
          hook.doneEach(fixAllLinks);
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
</html>
