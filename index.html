<script>
  window.$docsify = {
    name: 'Flax 中文文档',
    repo: 'https://github.com/jiaacode/FlaxDocs-zh',
    loadSidebar: true,
    subMaxLevel: 3,
    auto2top: true,
    basePath: '/FlaxDocs-zh/',
    homepage: 'index.md',
    plugins: [
      function(hook) {
        hook.doneEach(function() {
          // 选择所有以 .md 结尾的链接
          document.querySelectorAll('a[href$=".md"]').forEach(function(el) {
            var href = el.getAttribute('href');
            if (href) {
              // 去掉 .md 后缀，并确保以 / 结尾（除非是锚点或空）
              var newHref = href.replace(/\.md$/, '');
              if (newHref && !newHref.endsWith('/') && !newHref.endsWith('#')) {
                newHref += '/';
              }
              el.setAttribute('href', newHref);
            }
          });
        });
      }
    ]
  };
</script>
