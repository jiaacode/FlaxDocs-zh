<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 引擎中文文档</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Flax 中文文档',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      basePath: '/FlaxDocs-zh/',
      homepage: 'index.md',
      alias: {
        '/manual/(.*)': '/manual-zh/$1'
      },
      plugins: [
        function(hook) {
          hook.beforeEach(function(route) {
            if (route.path && route.path.endsWith('.md')) {
              route.path = route.path.replace(/\.md$/, '');
            }
            return route;
          });
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
</html>
