<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 引擎中文文档</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Flax 中文文档',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      basePath: '/FlaxDocs-zh/',
      homepage: 'index.md',
      // ========== doneEach 插件 ==========
      // 每次页面切换后，自动将 .md 链接改为不带后缀的路径
      // 避免浏览器直接请求 .md 文件导致下载或 404
      plugins: [
        function(hook) {
          hook.doneEach(function() {
            try {
              // 选取所有以 .md 结尾的链接（排除外部链接）
              document.querySelectorAll('a[href$=".md"]').forEach(function(el) {
                var href = el.getAttribute('href');
                // 只处理相对路径，不处理 http/https 开头的链接
                if (href && !href.startsWith('http')) {
                  // 去掉 .md 后缀
                  var newHref = href.replace(/\.md$/, '');
                  // 如果路径为空则补上 /，避免 Docsify 解析异常
                  if (newHref && !newHref.endsWith('/') && !newHref.endsWith('#')) {
                    newHref += '/';
                  }
                  el.setAttribute('href', newHref);
                }
              });
            } catch(e) {
              // 容错：插件出错不影响页面渲染
              console.warn('Docsify 链接修正插件出错:', e);
            }
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
</html>
