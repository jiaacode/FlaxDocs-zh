<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 引擎中文文档</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      // 网站名称（左上角显示）
      name: 'Flax 中文文档',

      // GitHub 仓库链接（右上角）
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',

      // 启用侧边栏（需要 _sidebar.md 文件）
      loadSidebar: true,

      // 自动生成目录深度
      subMaxLevel: 3,

      // 滚动时自动回到顶部
      auto2top: true,

      // 文档根目录（所有 .md 文件从这里读取）
      basePath: '/manual-zh/',

      // 首页文件（默认是 README.md，这里改为 index.md）
      homepage: 'index.md',

      // 自定义 404 页面（留空则显示默认 404）
      notFoundPage: false
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
</html>
