<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flax 引擎中文文档</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script>
    window.$docsify = {
      name: 'Flax 引擎文档（中文）',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      loadSidebar: true,
      loadNavbar: false,      // 如果你不需要顶部导航，保持 false
      coverpage: false,       // 如果你不需要封面，保持 false
      auto2top: true,
      maxLevel: 2,            // 侧边栏只显示到二级标题
      basePath: '/',          // 重要：因为你的 md 文件在根目录下的子文件夹
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'  // 所有子目录共用根侧边栏
      }
    };
  </script>
</body>
</html>
