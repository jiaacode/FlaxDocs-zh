<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 引擎中文文档</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Flax 中文文档',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      basePath: '/FlaxDocs-zh/',
      homepage: 'index.md',
      // ========== 路径别名（核心）==========
      // 将根目录 index.md 中的链接映射到实际文档位置
      // 无需修改任何源文件，只需在这里配置映射规则
      alias: {
        // Manual 链接：指向中文文档首页
        '/manual/index.md': '/manual-zh/index.md',
        // C# API 链接（保留英文原版，如果希望中文版可改路径）
        '/api/index.md': '/api/index.md',
        // C++ API 链接（保留英文原版）
        '/api-cpp/index.md': '/api-cpp/index.md'
        // 如果你还有其他类似链接，可以按相同格式添加
        // 例如：'/other/index.md': '/manual-zh/other/index.md'
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
</html>
