<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 引擎中文文档</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>

  <script>
    // ===== 拦截函数（全局） =====
    function handleLinkClick(e) {
      var target = e.target.closest('a');
      if (!target) return;

      var href = target.getAttribute('href');
      if (!href) return;

      if (href.match(/^(https?|mailto|javascript|#)/i)) return;
      if (!href.endsWith('.md')) return;

      e.preventDefault();

      // 使用 target.pathname 获取完整路径
      var pathname = target.pathname;
      pathname = pathname.replace(/\.md$/, '');
      pathname = pathname.replace('/manual/', '/manual-zh/');
      if (!pathname.endsWith('/')) pathname += '/';

      window.location.hash = pathname;
    }

    function bindInterceptor() {
      var container = document.getElementById('app');
      if (!container) return;
      container.removeEventListener('click', handleLinkClick);
      container.addEventListener('click', handleLinkClick);
    }

    // ===== 初始化 =====
    if (document.readyState === 'complete') {
      bindInterceptor();
    } else {
      window.addEventListener('load', bindInterceptor);
    }

    // ===== Docsify 配置 =====
    window.$docsify = {
      name: 'Flax 中文文档',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      basePath: '/FlaxDocs-zh/',
      homepage: 'index.md',
      plugins: [
        function(hook) {
          hook.doneEach(bindInterceptor);
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
</html>
