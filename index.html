<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 文档中文版</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // 动态获取部署路径，自动补全仓库名（官方推荐做法）
    var path = window.location.pathname;
    if (path.endsWith('/')) path = path.slice(0, -1); // 去掉末尾斜杠
    window.$docsify = {
      basePath: path + '/',  // 自动变为 '/FlaxDocs-zh/'
      loadSidebar: '_sidebar.md',
      subMaxLevel: 2,
      search: 'auto',
      routerMode: 'hash',
      homepage: 'index.md',
      catchLinks: true        // 官方链接拦截，开启即可
    };
  </script>
  <!-- 完全移除之前所有自定义拦截脚本，只保留 Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
