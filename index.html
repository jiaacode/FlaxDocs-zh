<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Flax 中文文档</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">加载中...</div>

  <script>
    var CONFIG = {
      basePath: '/FlaxDocs-zh/',
      aliasMap: {},
      treatNoExtensionAsMd: true,
    };

    function getCurrentFilePath() {
      var hash = window.location.hash;
      if (hash && hash.indexOf('#/') === 0) {
        var path = decodeURIComponent(hash.substring(2));
        path = path.split('?')[0].split('#')[0];
        return path;
      }
      return '';
    }

    function resolveRelativePath(currentFile, href) {
      if (href.indexOf('/') === 0) {
        return href.substring(1).replace(/\.md$/, '');
      }
      var dir = '';
      var lastSlash = currentFile.lastIndexOf('/');
      if (lastSlash !== -1) dir = currentFile.substring(0, lastSlash + 1);
      var combined = dir + href;
      var parts = combined.split('/');
      var stack = [];
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i];
        if (part === '' || part === '.') continue;
        else if (part === '..') stack.pop();
        else stack.push(part);
      }
      return stack.join('/').replace(/\.md$/, '');
    }

    function applyAlias(path) {
      var aliasMap = CONFIG.aliasMap;
      for (var oldPrefix in aliasMap) {
        if (path.indexOf(oldPrefix) === 0) {
          return aliasMap[oldPrefix] + path.substring(oldPrefix.length);
        }
      }
      return path;
    }

    function isExternal(href) {
      return /^(https?:|mailto:|tel:|#|\/\/)/i.test(href);
    }

    function isMdLink(href) {
      if (href.endsWith('.md')) return true;
      if (CONFIG.treatNoExtensionAsMd && href.indexOf('.') === -1) return true;
      return false;
    }

    function processDom() {
      var content = document.querySelector('.markdown-section') || document.querySelector('#main');
      if (!content) return;
      var currentFile = getCurrentFilePath();

      content.querySelectorAll('a').forEach(function(a) {
        if (a.dataset.processed) return;
        var href = a.getAttribute('href');
        if (!href || isExternal(href)) return;
        if (isMdLink(href)) {
          var cleanHref = href.split('#')[0].split('?')[0];
          var target = resolveRelativePath(currentFile, cleanHref);
          target = applyAlias(target);
          a.setAttribute('href', '#/' + target);
          a.dataset.processed = 'true';
        }
      });

      content.querySelectorAll('img').forEach(function(img) {
        if (img.dataset.processed) return;
        var src = img.getAttribute('src');
        if (!src || isExternal(src)) return;
        var resolvedPath = '';
        if (src.indexOf('/') === 0) {
          resolvedPath = src.substring(1);
        } else {
          resolvedPath = resolveRelativePath(currentFile, src);
        }
        resolvedPath = applyAlias(resolvedPath);
        var base = CONFIG.basePath;
        if (base.charAt(base.length - 1) !== '/') base += '/';
        img.setAttribute('src', base + resolvedPath);
        img.dataset.processed = 'true';
      });
    }
  </script>

  <script>
    window.$docsify = {
      name: 'Flax 中文文档',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      basePath: CONFIG.basePath,
      loadSidebar: true,
      homepage: 'index.md',
      hook: {
        doneEach: function() {
          processDom();
        }
      }
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

</body>
</html>
