<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>Flax 引擎中文文档</title>

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.css">
</head>
<body>
  <div id="app"></div>

  <!-- 核心库 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>

  <!-- 极简配置 -->
  <script>
    window.$docsify = {
      name: 'Flax 引擎文档（中文）',        // 侧边栏标题

      basePath: '/FlaxDocs-zh/',           // ★★★★★ 关键：你的仓库名，务必写对
      homepage: 'index.md',                // 首页使用根目录的 index.md

      auto2top: true                       // 切换页面滚到顶部
      // 其他统统不配置，最简！
    };
  </script>
