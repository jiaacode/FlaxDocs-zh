<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 引擎中文文档</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Flax 中文文档',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      basePath: '/FlaxDocs-zh/',
      homepage: 'index.md',
      // ========== 一次性链接修正（mounted 钩子） ==========
      // 只在页面刷新时执行一次，不会在路由切换时重复运行
      plugins: [
        function(hook) {
          hook.mounted(function() {
            try {
              // 只处理 index.md 中的链接（Manual、C# API、C++ API）
              document.querySelectorAll('#app a[href$=".md"]').forEach(function(el) {
                let href = el.getAttribute('href');
                if (href && !href.startsWith('http')) {
                  // 将 /manual/index.md 映射到 /manual-zh/index.md
                  let newHref = href.replace(/^\/manual\//, '/manual-zh/');
                  // 如果链接以 .md 结尾，保留 .md（让 Docsify 正常加载）
                  // 如果不以 .md 结尾，补上 .md
                  if (!newHref.endsWith('.md')) {
                    newHref += '.md';
                  }
                  el.setAttribute('href', newHref);
                }
              });
            } catch(e) {
              console.warn('链接修正脚本出错:', e);
            }
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>
</html>
