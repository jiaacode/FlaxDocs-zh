<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flax 文档中文版</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/stylesheet.min.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Flax 中文文档',
      repo: 'https://github.com/jiaacode/FlaxDocs-zh',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      copyCode: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档...'
      }
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-search/dist/docsify-search.min.js"></script>

  <script>
    document.addEventListener('click', function(e) {
      var link = e.target.closest('a');
      if (!link) return;
      var href = link.getAttribute('href');
      if (!href) return;
      if (/^https?:\/\//.test(href) || href.startsWith('//') || href.startsWith('#')) return;
      if (!href.includes('.md')) return;

      e.preventDefault();
      e.stopPropagation();

      var newPath = href.replace('.md', '');
      if (!newPath.startsWith('/')) newPath = '/' + newPath;
      window.location.hash = newPath;
    }, true);
  </script>
</body>
</html>
